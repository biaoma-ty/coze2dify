name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Backend — Lint + Test
  # ─────────────────────────────────────────────
  backend-lint:
    name: "Backend · Lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  backend-test:
    name: "Backend · Test (py${{ matrix.python }})"
    runs-on: ubuntu-latest
    needs: backend-lint
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Verify import
        run: python -c "from main import app; print('Import OK')"

      - name: Run tests
        run: pytest -v --tb=short

  backend-postgres-integration:
    name: "Backend · PostgreSQL Integration"
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run PostgreSQL integration tests
        env:
          COZE2DIFY_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: pytest -v --tb=short tests/test_postgres_integration.py

  # ─────────────────────────────────────────────
  # Frontend — Typecheck + Build
  # ─────────────────────────────────────────────
  frontend-check:
    name: "Frontend · Check (node${{ matrix.node }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload build artifact
        if: matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  e2e-smoke:
    name: "E2E · Migration Smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -e "./backend[dev]"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run migration smoke gate
        env:
          COZE2DIFY_E2E_BACKEND_PYTHON: python
        run: ./scripts/e2e-smoke.sh

      - name: Upload smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7

  # ─────────────────────────────────────────────
  # Docker — Build validation
  # ─────────────────────────────────────────────
  docker:
    name: "Docker · Build"
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: |
          if [ -f backend/Dockerfile ]; then
            docker build -t coze2dify-backend ./backend
          else
            echo "No backend Dockerfile found, skipping"
          fi

      - name: Build frontend image
        run: |
          if [ -f frontend/Dockerfile ]; then
            docker build -t coze2dify-frontend ./frontend
          else
            echo "No frontend Dockerfile found, skipping"
          fi
