services:
  init_permissions:
    image: busybox:latest
    command:
      - sh
      - -c
      - |
        mkdir -p /app/api/storage
        chown -R 1001:1001 /app/api/storage
    volumes:
      - ${DIFY_RUNTIME_ROOT}/app-storage:/app/api/storage
    restart: "no"

  api:
    image: langgenius/dify-api:1.13.0
    restart: always
    environment: &dify-env
      CONSOLE_API_URL: ""
      CONSOLE_WEB_URL: ""
      SERVICE_API_URL: ""
      TRIGGER_URL: http://localhost
      APP_API_URL: ""
      APP_WEB_URL: ""
      FILES_URL: ""
      INTERNAL_FILES_URL: ""
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONIOENCODING: utf-8
      UV_CACHE_DIR: /tmp/.uv-cache
      LOG_LEVEL: INFO
      LOG_OUTPUT_FORMAT: text
      LOG_FILE: /app/logs/server.log
      LOG_FILE_MAX_SIZE: 20
      LOG_FILE_BACKUP_COUNT: 5
      LOG_DATEFORMAT: "%Y-%m-%d %H:%M:%S"
      LOG_TZ: UTC
      DEBUG: "false"
      FLASK_DEBUG: "false"
      ENABLE_REQUEST_LOGGING: "False"
      SECRET_KEY: ${DIFY_SECRET_KEY}
      INIT_PASSWORD: ""
      DEPLOY_ENV: PRODUCTION
      OPENAI_API_BASE: https://api.openai.com/v1
      MIGRATION_ENABLED: "true"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      REFRESH_TOKEN_EXPIRE_DAYS: "30"
      DIFY_BIND_ADDRESS: 0.0.0.0
      DIFY_PORT: "5001"
      SERVER_WORKER_AMOUNT: "1"
      SERVER_WORKER_CLASS: gevent
      SERVER_WORKER_CONNECTIONS: "10"
      GUNICORN_TIMEOUT: "360"
      DB_TYPE: postgresql
      DB_USERNAME: ${DIFY_DB_USER}
      DB_PASSWORD: ${DIFY_DB_PASSWORD}
      DB_HOST: db_postgres
      DB_PORT: "5432"
      DB_DATABASE: ${DIFY_DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${DIFY_REDIS_PASSWORD}
      CELERY_BROKER_URL: redis://:${DIFY_REDIS_PASSWORD}@redis:6379/1
      CELERY_BACKEND: redis
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: fs
      OPENDAL_FS_ROOT: storage
      MAIL_TYPE: resend
      RESEND_API_KEY: test-key
      CODE_EXECUTION_ENDPOINT: http://sandbox:8194
      CODE_EXECUTION_API_KEY: ${DIFY_SANDBOX_API_KEY}
      CODE_EXECUTION_SSL_VERIFY: "True"
      SSRF_PROXY_HTTP_URL: http://ssrf_proxy:3128
      SSRF_PROXY_HTTPS_URL: http://ssrf_proxy:3128
      SANDBOX_API_KEY: ${DIFY_SANDBOX_API_KEY}
      SANDBOX_PORT: "8194"
      PLUGIN_DAEMON_URL: http://plugin_daemon:5002
      PLUGIN_DAEMON_KEY: ${DIFY_PLUGIN_DAEMON_KEY}
      PLUGIN_DIFY_INNER_API_KEY: ${DIFY_PLUGIN_INNER_API_KEY}
      PLUGIN_DIFY_INNER_API_URL: http://api:5001
      PLUGIN_REMOTE_INSTALL_HOST: localhost
      PLUGIN_REMOTE_INSTALL_PORT: "5003"
      PLUGIN_DAEMON_TIMEOUT: "600.0"
      PLUGIN_MAX_PACKAGE_SIZE: "52428800"
      INNER_API_KEY_FOR_PLUGIN: ${DIFY_PLUGIN_INNER_API_KEY}
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
      PLUGIN_WORKING_PATH: /app/storage/cwd
      PLUGIN_INSTALLED_PATH: plugin
      PLUGIN_PACKAGE_CACHE_PATH: plugin_packages
      PLUGIN_MEDIA_CACHE_PATH: assets
      MARKETPLACE_ENABLED: "false"
      FORCE_VERIFYING_SIGNATURE: "false"
      ENFORCE_LANGGENIUS_PLUGIN_SIGNATURES: "false"
      EDITION: SELF_HOSTED
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_started
      sandbox:
        condition: service_healthy
    volumes:
      - ${DIFY_RUNTIME_ROOT}/app-storage:/app/api/storage
    networks:
      - default
      - ssrf_proxy_network

  worker:
    image: langgenius/dify-api:1.13.0
    restart: always
    environment:
      <<: *dify-env
      MODE: worker
      INNER_API_KEY_FOR_PLUGIN: ${DIFY_PLUGIN_INNER_API_KEY}
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_started
      sandbox:
        condition: service_healthy
    volumes:
      - ${DIFY_RUNTIME_ROOT}/app-storage:/app/api/storage
    networks:
      - default
      - ssrf_proxy_network

  worker_beat:
    image: langgenius/dify-api:1.13.0
    restart: always
    environment:
      <<: *dify-env
      MODE: beat
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    image: langgenius/dify-web:1.13.0
    restart: always
    environment:
      CONSOLE_API_URL: ""
      APP_API_URL: ""
      MARKETPLACE_API_URL: https://marketplace.dify.ai
      MARKETPLACE_URL: https://marketplace.dify.ai
      NEXT_TELEMETRY_DISABLED: "1"

  db_postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DIFY_DB_USER}
      POSTGRES_PASSWORD: ${DIFY_DB_PASSWORD}
      POSTGRES_DB: ${DIFY_DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres -c 'max_connections=100'
               -c 'shared_buffers=128MB'
               -c 'work_mem=4MB'
               -c 'maintenance_work_mem=64MB'
               -c 'effective_cache_size=4096MB'
    ports:
      - "${DIFY_DB_PORT}:5432"
    volumes:
      - ${DIFY_RUNTIME_ROOT}/db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "db_postgres", "-U", "${DIFY_DB_USER}", "-d", "${DIFY_DB_NAME}"]
      interval: 1s
      timeout: 3s
      retries: 60

  redis:
    image: redis:6-alpine
    restart: always
    environment:
      REDISCLI_AUTH: ${DIFY_REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${DIFY_REDIS_PASSWORD}"]
    volumes:
      - ${DIFY_RUNTIME_ROOT}/redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${DIFY_REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 1s
      timeout: 3s
      retries: 30

  sandbox:
    image: langgenius/dify-sandbox:0.2.12
    restart: always
    environment:
      API_KEY: ${DIFY_SANDBOX_API_KEY}
      GIN_MODE: release
      WORKER_TIMEOUT: "15"
      ENABLE_NETWORK: "true"
      HTTP_PROXY: http://ssrf_proxy:3128
      HTTPS_PROXY: http://ssrf_proxy:3128
      SANDBOX_PORT: "8194"
    volumes:
      - ${DIFY_RUNTIME_ROOT}/sandbox-dependencies:/dependencies
      - ./sandbox/config.yaml:/conf/config.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8194/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - ssrf_proxy_network

  plugin_daemon:
    image: langgenius/dify-plugin-daemon:0.5.3-local
    restart: always
    environment:
      <<: *dify-env
      DB_DATABASE: ${DIFY_DB_NAME}
      SERVER_PORT: "5002"
      SERVER_KEY: ${DIFY_PLUGIN_DAEMON_KEY}
      DIFY_INNER_API_URL: http://api:5001
      DIFY_INNER_API_KEY: ${DIFY_PLUGIN_INNER_API_KEY}
      PLUGIN_REMOTE_INSTALLING_HOST: 0.0.0.0
      PLUGIN_REMOTE_INSTALLING_PORT: "5003"
      PPROF_ENABLED: "false"
    depends_on:
      db_postgres:
        condition: service_healthy
    volumes:
      - ${DIFY_RUNTIME_ROOT}/plugin-storage:/app/storage

  ssrf_proxy:
    image: ubuntu/squid:latest
    restart: always
    entrypoint:
      - sh
      - -c
    command:
      - /usr/sbin/squid -Nz && exec /usr/sbin/squid -f /etc/squid/squid.conf -NYC 1
    volumes:
      - ./ssrf_proxy/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - default
      - ssrf_proxy_network

  nginx:
    image: nginx:latest
    restart: always
    depends_on:
      - api
      - web
      - plugin_daemon
    ports:
      - "${DIFY_HTTP_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  ssrf_proxy_network:
    driver: bridge
    internal: true
