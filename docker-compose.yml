version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coze2dify
      POSTGRES_USER: coze2dify
      POSTGRES_PASSWORD: coze2dify
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      COZE2DIFY_DATABASE_URL: postgresql://coze2dify:coze2dify@db:5432/coze2dify
      COZE2DIFY_DEBUG: "false"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
